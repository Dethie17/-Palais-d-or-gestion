# Netlify Configuration pour O RESTO
# Déployer sur Netlify : connectez ce repo et configurez les variables d'env

[build]
  command = "npm run build"
  publish = "dist"

# Les fonctions Netlify sont servies nativement sur /.netlify/functions/*
# Aucune redirection ne doit intercepter ce chemin.

# Routes paiement (DOIVENT être AVANT le fallback SPA)
[[redirects]]
  from = "/paiement/success"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/paiement/echec"
  to = "/index.html"
  status = 200

# Redirections SPA (React Router) - DOIT ÊTRE EN DERNIER
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Configuration fonctions Netlify
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Variables d'environnement requises (à configurer dans Netlify Dashboard > Site settings > Environment variables) :
# 
# SUPABASE_URL = https://votre-projet.supabase.co
# SUPABASE_SERVICE_ROLE_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... (clé service_role, pas anon)
# INTOUCH_CALLBACK_SECRET = votre_cle_secrete_fournie_par_intouch
# 
# Optionnel - pour les emails/notifications :
# SENDGRID_API_KEY = SG.xxx
# FROM_EMAIL = noreply@orestosn.com