<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- Fond transparent -->
  <defs>
    <linearGradient id="greenCircle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#065f1f"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f1f"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Toque chef -->
  <g transform="translate(188,18)">
    <path d="M10 38 C -6 30 -8 12 8 8 C 10 -2 28 -6 36 4 C 48 -4 68 4 64 22 C 76 26 72 46 56 48 L 18 52 Z" fill="url(#hat)"/>
    <path d="M14 44 C 30 36 48 30 62 28" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Anneau vert O -->
  <circle cx="150" cy="105" r="72" fill="url(#greenCircle)"/>
  <circle cx="150" cy="105" r="44" fill="#ffffff"/>

  <!-- Fourchette -->
  <g fill="#1e293b">
    <rect x="129" y="82" width="5" height="26" rx="2"/>
    <rect x="137" y="82" width="5" height="26" rx="2"/>
    <rect x="145" y="82" width="5" height="26" rx="2"/>
    <rect x="129" y="102" width="21" height="8" rx="3"/>
    <rect x="136" y="108" width="7" height="38" rx="3"/>
  </g>
  <!-- Couteau -->
  <g fill="#1e293b">
    <path d="M155 82 h10 c5 12 5 28 0 40 h-10 z"/>
    <rect x="157" y="120" width="6" height="26" rx="3"/>
  </g>

  <!-- Swoosh orbital -->
  <g fill="none" stroke-linecap="round">
    <path d="M52 132 C 90 178 220 178 262 108" stroke="url(#swoosh)" stroke-width="12"/>
    <path d="M52 132 C 70 150 95 162 125 168" stroke="#065f1f" stroke-width="12"/>
  </g>
  <ellipse cx="150" cy="150" rx="88" ry="18" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95"/>
</svg>
